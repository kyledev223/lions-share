<!doctype html>
<html lang="en" class="is-locked is-booting">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Lion’s Share ($ROAR) · Hold $ROAR. The lion buys back.</title>
    <meta
      name="description"
      content="Hold $ROAR. A share of the fees buys $ROAR back on the open market and burns it, under published rules. A meme token with no intrinsic value; buybacks do not guarantee or support any price. Not financial advice. An independent community project, not affiliated with any exchange, launchpad or company."
    />
    <meta name="theme-color" content="#020308" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // Desktop layout is designed in a 1920×940 frame (sizes in rem). Scaling the
      // root font keeps the same proportions on every desktop screen. Phones keep 16px.
      ;(function () {
        var fit = function () {
          var w = window.innerWidth
          var h = window.innerHeight
          document.documentElement.style.fontSize = w < 900 ? '' : 16 * Math.min(w / 1920, h / 940) + 'px'
        }
        fit()
        window.addEventListener('resize', fit)
      })()
    </script>
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Share cards. Set VITE_SITE_URL in .env so the image URL is absolute. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lion’s Share" />
    <meta property="og:title" content="Lion’s Share ($ROAR) · Hold $ROAR. The lion buys back." />
    <meta
      property="og:description"
      content="Hold $ROAR. The lion buys back: a share of the fees buys $ROAR on the open market and burns it, under published rules. Meme token; buybacks do not guarantee or support any price. Not financial advice. Independent; not affiliated with any exchange, launchpad or company."
    />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="The Lion’s Share emblem, a geometric red lion head with an angular mane inside a notched coin ring, next to the words Lion’s Share, the lion buys back."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Lion’s Share ($ROAR) · Hold $ROAR. The lion buys back." />
    <meta
      name="twitter:description"
      content="Hold $ROAR. The lion buys back: a share of the fees buys $ROAR on the open market and burns it, under published rules. Meme token; buybacks do not guarantee or support any price. Not financial advice. Independent; not affiliated with any exchange, launchpad or company."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%/og.png" />
  </head>
  <body>
    <!-- The 3D scene. Everything else sits on top of it. -->
    <canvas id="gl" aria-hidden="true"></canvas>

    <!-- 0. Loader: a big 000 → 100 counter -->
    <div class="boot" id="boot" role="status" aria-label="Loading Lion’s Share">
      <span class="boot__corner boot__corner--tr">Lion’s Share · $ROAR</span>
      <div class="boot__center">
        <div class="boot__count" id="bootCount" aria-hidden="true">000</div>
        <div class="boot__bar" aria-hidden="true"><i id="bootBar"></i></div>
        <p class="boot__status" id="bootStatus">Gathering the pride…</p>
      </div>
      <span class="boot__corner boot__corner--bl">// Best with sound</span>
      <span class="boot__corner boot__corner--br">Scroll down to see how the buybacks work</span>
    </div>

    <!-- Entry: the star field and the emblem are live behind these -->
    <div class="entry" id="entry" hidden>
      <h1 class="visually-hidden">Lion’s Share</h1>
      <div class="entry__actions">
        <button class="pill pill--enter" type="button" data-enter="sound">Enter</button>
        <button class="textlink" type="button" data-enter="silent">Enter without sound</button>
      </div>
      <p class="entry__hint">Best with sound · change or mute the music from the corner</p>
      <button class="entry__skip" type="button" hidden>Skip intro</button>
    </div>

    <div id="site" inert>
      <!-- Top right: which screen this is -->
      <header class="hudlabel" data-after-enter>
        <p class="hudlabel__title"><span class="slashes" aria-hidden="true">//////</span> <b id="hudNum">01</b> — <span id="hudName">HOLD $ROAR</span></p>
        <p class="hudlabel__sub" id="hudSub"></p>
      </header>

      <!-- The twelve screens, rendered from src/screens.ts -->
      <main id="screens"></main>

      <nav class="rail" id="rail" aria-label="Screens" data-after-enter></nav>

      <!-- Bottom left: scroll hint and the music pill -->
      <div class="hud hud--bl" data-after-enter>
        <p class="hint">Scroll down to see how the buybacks work.</p>
        <div class="music" role="group" aria-label="Music">
          <button class="music__power" id="sndToggle" type="button" aria-pressed="false">
            <svg class="music__icon" viewBox="0 0 24 24" aria-hidden="true">
              <path class="music__speaker" d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" />
              <path class="music__waves" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.4 7.4 0 0 1 0 10.4" />
              <path class="music__cross" d="M15.5 9.5l5 5M20.5 9.5l-5 5" />
            </svg>
            <span id="sndLabel">Play music</span>
          </button>
          <button class="music__nav" id="sndPrev" type="button" aria-label="Previous track">&lt;&lt;</button>
          <span class="music__track">
            <span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
            <span class="marquee"><span class="marquee__in" id="sndMarquee"></span></span>
          </span>
          <button class="music__nav" id="sndNext" type="button" aria-label="Next track">&gt;&gt;</button>
        </div>
      </div>

      <!-- Bottom right: X, contract address and buy, shown once config.ts has them -->
      <div class="hud hud--br" data-after-enter>
        <a class="xlink" data-href="follow" href="#" aria-label="Lion’s Share on X">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" /></svg>
        </a>
        <span class="slot" data-ca></span>
        <span class="slot" data-buy></span>
      </div>
    </div>

    <dialog class="lightbox" id="lightbox" aria-label="Viewer">
      <div class="lightbox__inner">
        <button class="btn btn--ghost lightbox__close" id="lightboxClose" type="button">Close ✕</button>
        <div class="lightbox__stage" id="lightboxStage"></div>
        <div class="lightbox__bar">
          <button class="btn btn--ghost" id="lightboxPrev" type="button" aria-label="Previous meme">⟵</button>
          <span id="lightboxCaption"></span>
          <button class="btn btn--ghost" id="lightboxNext" type="button" aria-label="Next meme">⟶</button>
        </div>
      </div>
    </dialog>

    <!-- Phones: screen 12's "Read more" opens the full disclaimer here (filled from config.ts). -->
    <dialog class="sheet" id="disclaimerSheet" aria-labelledby="disclaimerSheetTitle">
      <div class="sheet__inner">
        <p class="sheet__title" id="disclaimerSheetTitle">Disclaimer</p>
        <p class="sheet__text" id="disclaimerSheetText"></p>
        <button class="btn btn--ghost sheet__close" id="disclaimerSheetClose" type="button">Close ✕</button>
      </div>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="cursor" id="cursor" aria-hidden="true"><i class="cursor__ring"></i><i class="cursor__dot"></i><b class="cursor__label"></b></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
