# Netlify build settings. See "Deploy" in README.md.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # scripts/og.mjs needs Node 22.18 or newer.
  NODE_VERSION = "22"

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
